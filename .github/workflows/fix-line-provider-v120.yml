name: One-time fix LINE custom provider v120
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-line-provider-v120.yml
permissions:
  contents: read
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Update and verify LINE provider
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            'https://ygrlvmyqrhyfkglomsbq.supabase.co/functions/v1/line-provider-fix-v120' \
            -o line-provider-result.json
          python3 - <<'PY'
          import json
          data=json.load(open('line-provider-result.json'))
          print(json.dumps(data, ensure_ascii=False, indent=2))
          assert data.get('ok') is True
          after=data.get('after') or {}
          assert after.get('identifier') == 'custom:line'
          assert after.get('enabled') is True
          assert after.get('email_optional') is True
          scopes=set(after.get('scopes') or [])
          assert {'openid','profile'} <= scopes
          PY
      - name: Verify Supabase redirects LINE with valid OIDC scopes
        run: |
          set -euo pipefail
          curl --silent --show-error --get --dump-header line-auth-headers.txt --output /dev/null \
            --data-urlencode 'provider=custom:line' \
            --data-urlencode 'redirect_to=https://sonia6891.github.io/https-github.com-facebook-facebook-ios-sdk/' \
            'https://ygrlvmyqrhyfkglomsbq.supabase.co/auth/v1/authorize'
          python3 - <<'PY'
          from urllib.parse import urlparse,parse_qs,unquote
          headers=open('line-auth-headers.txt',encoding='utf-8').read().splitlines()
          status=headers[0] if headers else ''
          locations=[line.split(':',1)[1].strip() for line in headers if line.lower().startswith('location:')]
          assert '302' in status or '303' in status, status
          assert locations, 'missing redirect location'
          target=locations[-1]
          parsed=urlparse(target)
          assert parsed.netloc=='access.line.me', target
          query=parse_qs(parsed.query)
          scopes=' '.join(query.get('scope',[]))
          print('LINE redirect host:',parsed.netloc)
          print('LINE scopes:',scopes)
          assert 'openid' in scopes.split()
          assert 'profile' in scopes.split()
          assert '、' not in scopes
          PY
