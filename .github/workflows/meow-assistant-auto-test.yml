name: Meow Assistant automatic self-test

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/meow-labor-knowledge-v1.json'
      - 'supabase/functions/meow-assistant-route/index.ts'
      - 'tests/meow-assistant-*.test.cjs'
      - '.github/workflows/meow-assistant-auto-test.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: meow-assistant-auto-test
  cancel-in-progress: true

jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Core regression — round two
        run: node tests/meow-assistant-round2-100.test.cjs

      - name: OpenAI NLU integration contract
        run: node tests/meow-assistant-ai-nlu.test.cjs

      - name: Multi-turn conversation memory
        run: node tests/meow-assistant-conversation-memory.test.cjs

      - name: Contextual operation safety
        run: node tests/meow-assistant-contextual-operations.test.cjs

      - name: Multi-turn stateful E2E
        run: node tests/meow-assistant-multiturn-e2e.test.cjs

      - name: Multi-turn fuzz — 1000 stateful turns
        run: node tests/meow-assistant-multiturn-fuzz-1000.test.cjs

      - name: Multi-intent response composition
        run: node tests/meow-assistant-multi-intent-response.test.cjs

      - name: Taiwan labor knowledge base
        run: node tests/meow-assistant-labor-kb.test.cjs

      - name: Layer 4 App-data grounding
        run: node tests/meow-assistant-layer4-grounding.test.cjs

      - name: Natural-language discovery — 400 cases
        run: node tests/meow-assistant-auto-discovery.test.cjs

      - name: Upload Meow Assistant test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meow-assistant-auto-test-report
          path: test-results/
          retention-days: 14
