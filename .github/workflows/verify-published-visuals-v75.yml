name: Verify published mobile visuals v75
on:
  push:
    branches: ["repair/mobile-visuals-v75-live"]
permissions:
  contents: read
jobs:
  verify-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser verification tools
        run: |
          python -m pip install --quiet Pillow==11.3.0 playwright==1.55.0
          python -m playwright install --with-deps chromium webkit > /tmp/browser-install.log 2>&1 || (tail -60 /tmp/browser-install.log; exit 1)
      - name: Verify exact published page and desktop regression
        run: |
          git worktree add --detach /tmp/meow-before 5477916a4171c4f78022e315b9a42f855be483a5
          git worktree add --detach /tmp/meow-after 8a1bcdd7e74863718b6d40301ef83d7182e6dca4
          python .repair/verify_published.py
          cat live-qa/result.json >> "$GITHUB_STEP_SUMMARY"
      - name: Save published-page evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-mobile-visuals-v75
          path: live-qa
          if-no-files-found: warn
