name: Verify final framed welcome v113
on:
  push:
    branches: [fix/framed-welcome-v113]
permissions:
  contents: read
concurrency:
  group: prepare-frame-v113
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/fix/framed-welcome-v113'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout isolated fix branch
        uses: actions/checkout@v6
        with:
          ref: fix/framed-welcome-v113
      - name: Fit card height to content without changing its scroll limit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ['index.html','tools/apply-welcome-frame-v113.py']:
              p=Path(name);s=p.read_text()
              old='height:auto;max-height:calc(100vh - 32px)'
              assert s.count(old)==1, 'Unexpected source: '+name
              p.write_text(s.replace(old,'height:fit-content;max-height:calc(100vh - 32px)'))
          p=Path('tests/browser-frame-v113.py');s=p.read_text()
          anchor=" check('圓角為 28px',r['radius']=='28px')"
          assert s.count(anchor)==1
          s=s.replace(anchor,anchor+"\n check('一般手機高度隨內容縮合，不強行撐滿',r['h']<r['vh']-60)")
          p.write_text(s)
          PY
      - name: Theme regression checks
        run: node tests/theme-persistence.test.cjs
      - name: Install browser test dependencies
        run: |
          python3 -m pip install playwright==1.57.0
          python3 -m playwright install --with-deps chromium
      - name: Existing welcome and Pro data access regressions
        run: python3 tests/browser-v112.py
      - name: Final framed welcome and existing-user display regressions
        run: python3 tests/browser-frame-v113.py
      - name: Commit verified source on isolated branch and remove temporary workflow
        run: |
          git rm .github/workflows/prepare-frame-v113.yml
          git add index.html tools/apply-welcome-frame-v113.py tests/browser-frame-v113.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Size framed welcome to content and verify upgrade entry (v113)'
          git push origin HEAD:fix/framed-welcome-v113
          git rev-parse HEAD > test-results/verified-commit.txt
      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: framed-welcome-v113-final-preflight
          path: test-results/
          retention-days: 3
