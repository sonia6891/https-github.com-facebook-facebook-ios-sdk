name: StoreKit local purchase smoke

on:
  push:
    branches: [main]
    paths:
      - index.html
      - native/ios-sources/MeowWork.storekit
      - native/ios-sources/ViewController.swift
      - native/capacitor.config.json
      - native/storekit-ios-smoke/**
      - supabase/functions/verify-app-store-transaction/index.ts
      - supabase/functions/app-store-notifications-v2/index.ts
      - tests/storekit-verification-gate-v130.test.cjs
      - tests/app-store-sandbox-preflight-v131.test.cjs
      - tests/app-store-notifications-v2-gate-v135.test.cjs
      - .github/workflows/storekit-local-smoke.yml
  pull_request:
    paths:
      - index.html
      - native/ios-sources/MeowWork.storekit
      - native/ios-sources/ViewController.swift
      - native/capacitor.config.json
      - native/storekit-ios-smoke/**
      - supabase/functions/verify-app-store-transaction/index.ts
      - supabase/functions/app-store-notifications-v2/index.ts
      - tests/storekit-verification-gate-v130.test.cjs
      - tests/app-store-sandbox-preflight-v131.test.cjs
      - tests/app-store-notifications-v2-gate-v135.test.cjs
      - .github/workflows/storekit-local-smoke.yml
  workflow_dispatch:

concurrency:
  group: storekit-local-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  storekit-smoke:
    runs-on: macos-26
    steps:
      - name: Select Xcode 26.2 and iOS 26.2 runtime
        run: |
          sudo xcode-select -s /Applications/Xcode_26.2.app
          xcodebuild -version
          xcrun simctl list runtimes | grep 'iOS 26.2'
          xcrun simctl list devices available | grep -A 12 'iOS 26.2'

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Verify backend-before-finish gate
        run: node --test tests/storekit-verification-gate-v130.test.cjs

      - name: Verify App Store Sandbox consistency
        run: node --test tests/app-store-sandbox-preflight-v131.test.cjs

      - name: Verify App Store notification state mapping
        run: node --test tests/app-store-notifications-v2-gate-v135.test.cjs

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Generate iOS StoreKit smoke host
        working-directory: native/storekit-ios-smoke
        run: |
          cp ../ios-sources/MeowWork.storekit ./MeowWork.storekit
          xcodegen generate
          xcodebuild -project MeowStoreKitSmoke.xcodeproj -list

      - name: Run iOS-hosted StoreKitTest purchase smoke
        working-directory: native/storekit-ios-smoke
        run: |
          set -o pipefail
          xcodebuild test \
            -project MeowStoreKitSmoke.xcodeproj \
            -scheme MeowStoreKitSmokeHost \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.2' \
            -derivedDataPath "${RUNNER_TEMP}/meow-storekit-derived" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            | tee "${RUNNER_TEMP}/meow-storekit-xcodebuild.log"
