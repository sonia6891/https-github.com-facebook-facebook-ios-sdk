name: StoreKit local purchase smoke

on:
  push:
    branches: [main]
    paths:
      - index.html
      - native/ios-sources/MeowWork.storekit
      - native/ios-sources/ViewController.swift
      - native/storekit-smoke/**
      - tests/storekit-verification-gate-v130.test.cjs
      - .github/workflows/storekit-local-smoke.yml
  pull_request:
    paths:
      - index.html
      - native/ios-sources/MeowWork.storekit
      - native/ios-sources/ViewController.swift
      - native/storekit-smoke/**
      - tests/storekit-verification-gate-v130.test.cjs
      - .github/workflows/storekit-local-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  storekit-smoke:
    # StoreKitTest SKTestSession is currently unreliable on the hosted Xcode
    # 26.5/26.6 runtime (SKInternalErrorDomain Code=3). Xcode 26.2 on the
    # macOS 26 image runs the same test APIs without that runner regression.
    runs-on: macos-26
    steps:
      - name: Select StoreKitTest-compatible Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.2.app
          xcodebuild -version
          swift --version

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Verify backend-before-finish gate
        run: node --test tests/storekit-verification-gate-v130.test.cjs

      - name: Run StoreKitTest purchase smoke
        working-directory: native/storekit-smoke
        run: swift test
