name: Bootstrap native iOS project

on:
  push:
    branches: [main]
    paths:
      - index.html
      - sw.js
      - manifest.webmanifest
      - support.html
      - terms.html
      - privacy.html
      - assets/**
      - workcat-home-v12.png
      - app-icon-v115-180.png
      - app-icon-v115-192.png
      - app-icon-v115-512.png
      - native/package.json
      - native/capacitor.config.json
      - native/scripts/**
      - native/ios-sources/**
      - native/.gitignore
      - .github/workflows/bootstrap-native-ios.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-native-ios-main
  cancel-in-progress: true

jobs:
  bootstrap:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install pinned Capacitor
        working-directory: native
        run: npm install

      - name: Generate v155 full-bleed desktop and home-screen icons
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 native/scripts/generate-app-icons-v155.py
          for f in app-icon-v155-180.png app-icon-v155-192.png app-icon-v155-512.png; do
            test -s "$f"
            INFO="$(sips -g pixelWidth -g pixelHeight -g hasAlpha "$f")"
            echo "$INFO"
            echo "$INFO" | grep -q 'hasAlpha: no'
          done

      - name: Sync web bundle
        working-directory: native
        run: npm run sync:web

      - name: Recreate iOS shell
        working-directory: native
        run: |
          rm -rf ios
          npx cap add ios
          node scripts/patch-ios-bridge.mjs
          sips -z 1024 1024 ../app-icon-v155-512.png --out ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png >/dev/null
          BRAND_TMP="$(mktemp -d)"
          sips -z 928 928 ../app-icon-v155-512.png --out "$BRAND_TMP/splash-art.png" >/dev/null
          sips -p 2732 2732 --padColor FFF8EF "$BRAND_TMP/splash-art.png" --out ios/App/App/Assets.xcassets/Splash.imageset/splash-2732x2732.png >/dev/null
          cp ios/App/App/Assets.xcassets/Splash.imageset/splash-2732x2732.png ios/App/App/Assets.xcassets/Splash.imageset/splash-2732x2732-1.png
          cp ios/App/App/Assets.xcassets/Splash.imageset/splash-2732x2732.png ios/App/App/Assets.xcassets/Splash.imageset/splash-2732x2732-2.png
          rm -rf "$BRAND_TMP"
          /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" ios/App/App/Info.plist || \
            /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription 使用相機拍攝班表、薪資單或頭像圖片。" ios/App/App/Info.plist || \
            /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 使用相機拍攝班表、薪資單或頭像圖片。" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryUsageDescription 選取班表、薪資單或頭像圖片。" ios/App/App/Info.plist || \
            /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 選取班表、薪資單或頭像圖片。" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait" ios/App/App/Info.plist
          cp ios-sources/MeowWork.storekit ios/App/MeowWork.storekit
          mkdir -p ios/App/App.xcodeproj/xcshareddata/xcschemes
          cp ios-sources/App.xcscheme ios/App/App.xcodeproj/xcshareddata/xcschemes/App.xcscheme
          npx cap sync ios

      - name: Verify StoreKit and reminder bridge source
        working-directory: native
        run: |
          grep -q 'MeowStoreBillingPlugin' ios/App/App/SceneDelegate.swift
          grep -q 'registerPluginInstance' ios/App/App/SceneDelegate.swift
          grep -q 'Product.products' ios/App/App/SceneDelegate.swift
          grep -q 'Transaction.currentEntitlements' ios/App/App/SceneDelegate.swift
          grep -q 'showManageSubscriptions' ios/App/App/SceneDelegate.swift
          grep -q 'meowwork.pro.monthly' ios/App/App/SceneDelegate.swift
          grep -q 'meowwork.pro.yearly' ios/App/App/SceneDelegate.swift
          grep -q 'appAccountToken' ios/App/App/SceneDelegate.swift
          grep -q 'jwsRepresentation' ios/App/App/SceneDelegate.swift
          grep -q 'finishTransaction' ios/App/App/SceneDelegate.swift
          grep -q 'getUnfinishedTransactions' ios/App/App/SceneDelegate.swift
          grep -q 'transactionUpdated' ios/App/App/SceneDelegate.swift
          grep -q 'Transaction.updates' ios/App/App/SceneDelegate.swift
          grep -q 'eligibleForIntroOffer' ios/App/App/SceneDelegate.swift
          grep -q 'MeowReminderPlugin' ios/App/App/SceneDelegate.swift
          grep -q 'UNUserNotificationCenter' ios/App/App/SceneDelegate.swift
          grep -q 'requestPermission' ios/App/App/SceneDelegate.swift
          grep -q 'getPermissionStatus' ios/App/App/SceneDelegate.swift
          grep -q 'UNTimeIntervalNotificationTrigger' ios/App/App/SceneDelegate.swift
          grep -q 'registerPluginInstance(MeowReminderPlugin())' ios/App/App/SceneDelegate.swift
          grep -q 'MeowAppleAuthPlugin' ios/App/App/SceneDelegate.swift
          grep -q 'AuthenticationServices' ios/App/App/SceneDelegate.swift
          grep -q 'registerPluginInstance(MeowAppleAuthPlugin())' ios/App/App/SceneDelegate.swift
          grep -q 'MeowScheduleVisionPlugin' ios/App/App/SceneDelegate.swift
          grep -q 'import Vision' ios/App/App/SceneDelegate.swift
          grep -q 'VNRecognizeTextRequest' ios/App/App/SceneDelegate.swift
          grep -q 'registerPluginInstance(MeowScheduleVisionPlugin())' ios/App/App/SceneDelegate.swift
          grep -q 'purpose == "payslip"' ios/App/App/SceneDelegate.swift
          grep -q 'request.usesLanguageCorrection = purpose == "payslip"' ios/App/App/SceneDelegate.swift
          grep -q "purpose:'payslip'" ../index.html
          grep -q "purpose:'schedule'" ../index.html
          grep -q 'MeowScheduleVision' ../index.html
          if grep -q "invokeUserFunction('pro-ai',{mode:'schedule_scan'" ../index.html; then
            echo "Schedule import must remain on-device and must not call OpenAI"
            exit 1
          fi
          grep -q 'window?.rootViewController = ViewController()' ios/App/App/SceneDelegate.swift
          /usr/libexec/PlistBuddy -c "Print :NSCameraUsageDescription" ios/App/App/Info.plist | grep -q '班表'
          /usr/libexec/PlistBuddy -c "Print :NSPhotoLibraryUsageDescription" ios/App/App/Info.plist | grep -q '薪資單'
          ICON_INFO="$(sips -g pixelWidth -g pixelHeight -g hasAlpha ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png)"
          echo "$ICON_INFO" | grep -q 'pixelWidth: 1024'
          echo "$ICON_INFO" | grep -q 'pixelHeight: 1024'
          echo "$ICON_INFO" | grep -q 'hasAlpha: no'
          SPLASH_INFO="$(sips -g pixelWidth -g pixelHeight ios/App/App/Assets.xcassets/Splash.imageset/splash-2732x2732.png)"
          echo "$SPLASH_INFO" | grep -q 'pixelWidth: 2732'
          echo "$SPLASH_INFO" | grep -q 'pixelHeight: 2732'
          cmp ios/App/App/Assets.xcassets/Splash.imageset/splash-2732x2732.png ios/App/App/Assets.xcassets/Splash.imageset/splash-2732x2732-1.png
          cmp ios/App/App/Assets.xcassets/Splash.imageset/splash-2732x2732.png ios/App/App/Assets.xcassets/Splash.imageset/splash-2732x2732-2.png
          test -f ios/App/App/PrivacyInfo.xcprivacy
          grep -q 'NSPrivacyCollectedDataTypeOtherFinancialInfo' ios/App/App/PrivacyInfo.xcprivacy
          grep -q 'NSPrivacyCollectedDataTypeHealth' ios/App/App/PrivacyInfo.xcprivacy
          grep -q 'NSPrivacyCollectedDataTypePhotosorVideos' ios/App/App/PrivacyInfo.xcprivacy
          grep -q 'NSPrivacyCollectedDataTypeOtherUserContent' ios/App/App/PrivacyInfo.xcprivacy
          grep -q 'PrivacyInfo.xcprivacy in Resources' ios/App/App.xcodeproj/project.pbxproj
          test -f ios/App/App/App.entitlements
          grep -q 'com.apple.developer.applesignin' ios/App/App/App.entitlements
          grep -q 'CODE_SIGN_ENTITLEMENTS = App/App.entitlements;' ios/App/App.xcodeproj/project.pbxproj
          grep -q 'TARGETED_DEVICE_FAMILY = 1;' ios/App/App.xcodeproj/project.pbxproj
          if grep -q 'TARGETED_DEVICE_FAMILY = "1,2";' ios/App/App.xcodeproj/project.pbxproj; then
            echo "Unexpected iPad support in iPhone-only v1 target"
            exit 1
          fi
          if grep -q 'ViewController.swift in Sources' ios/App/App.xcodeproj/project.pbxproj; then
            echo "Unexpected duplicate ViewController source reference"
            exit 1
          fi
          grep -q 'meowwork.pro.monthly' ios/App/MeowWork.storekit
          grep -q 'meowwork.pro.yearly' ios/App/MeowWork.storekit
          grep -q '"subscriptionPeriod" : "P3D"' ios/App/MeowWork.storekit
          grep -q '"displayPrice" : "99"' ios/App/MeowWork.storekit
          grep -q '"displayPrice" : "790"' ios/App/MeowWork.storekit
          grep -q 'StoreKitConfigurationFileReference' ios/App/App.xcodeproj/xcshareddata/xcschemes/App.xcscheme
          grep -q '../../MeowWork.storekit' ios/App/App.xcodeproj/xcshareddata/xcschemes/App.xcscheme
          python3 - <<'PY'
          import json
          from pathlib import Path
          cfg=json.loads(Path('ios/App/MeowWork.storekit').read_text())
          groups=cfg.get('subscriptionGroups') or []
          assert len(groups)==1, groups
          subs=groups[0].get('subscriptions') or []
          by_id={x.get('productID'):x for x in subs}
          assert by_id['meowwork.pro.monthly']['displayPrice']=='99'
          assert by_id['meowwork.pro.monthly']['recurringSubscriptionPeriod']=='P1M'
          assert by_id['meowwork.pro.monthly']['introductoryOffer']['paymentMode']=='free'
          assert by_id['meowwork.pro.monthly']['introductoryOffer']['subscriptionPeriod']=='P3D'
          assert by_id['meowwork.pro.yearly']['displayPrice']=='790'
          assert by_id['meowwork.pro.yearly']['recurringSubscriptionPeriod']=='P1Y'
          assert by_id['meowwork.pro.yearly']['introductoryOffer']['paymentMode']=='free'
          assert by_id['meowwork.pro.yearly']['introductoryOffer']['subscriptionPeriod']=='P3D'
          print('StoreKit local config JSON verified')
          PY

      - name: Build iOS simulator app
        working-directory: native
        run: |
          set -euo pipefail
          if [ -d ios/App/App.xcworkspace ]; then
            xcodebuild \
              -workspace ios/App/App.xcworkspace \
              -scheme App \
              -sdk iphonesimulator \
              -configuration Debug \
              CODE_SIGNING_ALLOWED=NO \
              build
          else
            xcodebuild \
              -project ios/App/App.xcodeproj \
              -scheme App \
              -sdk iphonesimulator \
              -configuration Debug \
              CODE_SIGNING_ALLOWED=NO \
              build
          fi

      - name: Build unsigned iOS Release device app
        working-directory: native
        run: |
          set -euo pipefail
          if [ -d ios/App/App.xcworkspace ]; then
            xcodebuild \
              -workspace ios/App/App.xcworkspace \
              -scheme App \
              -sdk iphoneos \
              -configuration Release \
              CODE_SIGNING_ALLOWED=NO \
              build
          else
            xcodebuild \
              -project ios/App/App.xcodeproj \
              -scheme App \
              -sdk iphoneos \
              -configuration Release \
              CODE_SIGNING_ALLOWED=NO \
              build
          fi

      - name: Verify App Store submission bundle
        working-directory: native
        run: |
          set -euo pipefail
          APP_DIR="$(find "$HOME/Library/Developer/Xcode/DerivedData" -type d -path '*/Build/Products/Debug-iphonesimulator/App.app' -print -quit)"
          test -n "$APP_DIR"
          test -f "$APP_DIR/public/privacy.html"
          test -f "$APP_DIR/public/terms.html"
          test -f "$APP_DIR/public/support.html"
          /usr/libexec/PlistBuddy -c "Print :ITSAppUsesNonExemptEncryption" "$APP_DIR/Info.plist" | grep -q false
          /usr/libexec/PlistBuddy -c "Print :NSCameraUsageDescription" "$APP_DIR/Info.plist" | grep -q '班表'
          /usr/libexec/PlistBuddy -c "Print :NSPhotoLibraryUsageDescription" "$APP_DIR/Info.plist" | grep -q '薪資單'
          IPHONE_ORIENTATIONS="$(/usr/libexec/PlistBuddy -c "Print :UISupportedInterfaceOrientations" "$APP_DIR/Info.plist")"
          echo "$IPHONE_ORIENTATIONS" | grep -q UIInterfaceOrientationPortrait
          if echo "$IPHONE_ORIENTATIONS" | grep -q UIInterfaceOrientationLandscape; then
            echo "iPhone landscape must remain disabled for v1."
            exit 1
          fi
          PRIVACY_MANIFEST_COUNT="$(find "$APP_DIR" -name PrivacyInfo.xcprivacy -type f | wc -l | tr -d ' ')"
          test "$PRIVACY_MANIFEST_COUNT" -ge 2
          test -f "$APP_DIR/PrivacyInfo.xcprivacy"
          grep -q 'NSPrivacyCollectedDataTypeOtherFinancialInfo' "$APP_DIR/PrivacyInfo.xcprivacy"
          grep -q 'NSPrivacyCollectedDataTypeHealth' "$APP_DIR/PrivacyInfo.xcprivacy"
          echo "App bundle legal pages, export compliance flag, app privacy manifest, and SDK privacy manifests verified."

      - name: Commit generated iOS project
        run: |
          set -euo pipefail
          git config user.name "meow-native-bot"
          git config user.email "actions@users.noreply.github.com"
          git add native/ios native/package-lock.json app-icon-v155-180.png app-icon-v155-192.png app-icon-v155-512.png
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "main advanced while this native build was running; verified generated output will be rebuilt by the newer run, so skip auto-commit to avoid a false rebase conflict."
            exit 0
          fi
          git commit -m "Generate Capacitor iOS project with native bridges [skip ci]"
          git push origin HEAD:main
