name: Verify safe cleanup v89
on:
  push:
    branches: [cleanup/audit-v89]
permissions:
  contents: write
concurrency:
  group: meow-cleanup-v89
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BASE: 022840b11e3ac83758440cc73b2bbb4b0dd02e8b
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated test tools
        run: |
          python -m pip install Pillow==11.3.0 tinycss2==1.4.0 beautifulsoup4==4.13.5 playwright==1.55.0
          python -m playwright install --with-deps chromium webkit
      - name: Prepare pinned production copies
        run: |
          mkdir -p "$RUNNER_TEMP/cleanup-before" "$RUNNER_TEMP/cleanup-after" "$RUNNER_TEMP/cleanup-report"
          git archive "$BASE" | tar -x -C "$RUNNER_TEMP/cleanup-before"
          cp -a "$RUNNER_TEMP/cleanup-before/." "$RUNNER_TEMP/cleanup-after/"
          python maintenance/apply_cleanup.py "$RUNNER_TEMP/cleanup-after" "$RUNNER_TEMP/cleanup-report"
          python -c 'import pathlib,re,os; s=pathlib.Path(os.environ["RUNNER_TEMP"],"cleanup-after","index.html").read_text(); pathlib.Path(os.environ["RUNNER_TEMP"],"cleanup-app.js").write_text(re.findall(r"<script[^>]*>([\s\S]*?)</script>",s)[-1])'
          node --check "$RUNNER_TEMP/cleanup-app.js"
      - name: Compare all pages and exercise date, avatar, itinerary, fallback
        run: python maintenance/test_cleanup.py "$RUNNER_TEMP/cleanup-before" "$RUNNER_TEMP/cleanup-after" "$RUNNER_TEMP/cleanup-report"
      - name: Create tested candidate only; never update main here
        run: |
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          export GIT_INDEX_FILE="$RUNNER_TEMP/cleanup-index"
          git read-tree "$BASE"
          for path in index.html 404.html manifest.webmanifest sw.js; do
            blob=$(git hash-object -w "$RUNNER_TEMP/cleanup-after/$path")
            git update-index --add --cacheinfo "100644,$blob,$path"
          done
          git update-index --force-remove app-icon-180.png apple-touch-icon-v3.png icon.svg mobile-rest-card-v1.jpg
          tree=$(git write-tree)
          git config user.name 'sonia6891'
          git config user.email '107385898+sonia6891@users.noreply.github.com'
          candidate=$(printf '%s\n' 'Safely remove unused legacy assets and dead UI code (v89)' | git commit-tree "$tree" -p "$BASE")
          git push origin "$candidate:refs/heads/cleanup/candidate-v89"
          printf '%s\n' "$candidate" > "$RUNNER_TEMP/cleanup-report/candidate-sha.txt"
          git diff --stat "$BASE" "$candidate" > "$RUNNER_TEMP/cleanup-report/diff-stat.txt"
          echo "Tested candidate: $candidate"
      - name: Preserve cleanup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cleanup-v89-verification
          path: ${{ runner.temp }}/cleanup-report
          retention-days: 7
