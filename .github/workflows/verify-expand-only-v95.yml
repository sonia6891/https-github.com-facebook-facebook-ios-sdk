name: Verify schedule edit gate v95
on:
  push:
    branches: ["repair/expand-only-v95"]
permissions:
  contents: write
concurrency:
  group: expand-only-v95
  cancel-in-progress: true
env:
  BASE: 0227d1cfdde8c87814ea86b3c75c53d8fe00f304
  LIVE_URL: ""
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated test browsers
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium webkit
      - name: Build reviewed edit-gate change
        run: |
          mkdir -p "$RUNNER_TEMP/gate-before" "$RUNNER_TEMP/gate-after" "$RUNNER_TEMP/gate-report"
          git archive "$BASE" | tar -x -C "$RUNNER_TEMP/gate-before"
          cp -a "$RUNNER_TEMP/gate-before/." "$RUNNER_TEMP/gate-after/"
          python maintenance/apply_gated_v95.py "$RUNNER_TEMP/gate-after"
          python -c 'import pathlib,re,os; s=pathlib.Path(os.environ["RUNNER_TEMP"],"gate-after/index.html").read_text(); pathlib.Path(os.environ["RUNNER_TEMP"],"app.js").write_text(re.findall(r"<script[^>]*>([\s\S]*?)</script>",s)[-1])'
          node --check "$RUNNER_TEMP/app.js"
      - name: Wait for exact tested source when verifying production
        if: env.LIVE_URL != ''
        run: |
          python - <<'PY'
          import os,time,hashlib,urllib.request
          expected='925db6f73d182617318c9b0783d751b7a18f2cbdc0d649256f01aee2524f0440'
          for attempt in range(24):
            try:
              with urllib.request.urlopen(urllib.request.Request(os.environ['LIVE_URL'],headers={'Cache-Control':'no-cache'}),timeout=15) as r:
                if r.status==200 and hashlib.sha256(r.read()).hexdigest()==expected:
                  print('Exact tested source is published')
                  break
            except Exception as e:
              print(type(e).__name__)
            time.sleep(5)
          else:
            raise SystemExit('Published source does not match tested files')
          PY
      - name: Verify collapsed read-only and expanded editing without data loss
        run: python maintenance/test_gated_v95.py "$RUNNER_TEMP/gate-before" "$RUNNER_TEMP/gate-after" "$RUNNER_TEMP/gate-report"
      - name: Prepare tested candidate without changing main
        if: env.LIVE_URL == ''
        run: |
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          export GIT_INDEX_FILE="$RUNNER_TEMP/gate-index"
          git read-tree "$BASE"
          for path in index.html sw.js; do
            blob=$(git hash-object -w "$RUNNER_TEMP/gate-after/$path")
            git update-index --add --cacheinfo "100644,$blob,$path"
          done
          tree=$(git write-tree)
          git config user.name 'sonia6891'
          git config user.email '107385898+sonia6891@users.noreply.github.com'
          candidate=$(printf '%s\n' 'Allow schedule changes only while settings are expanded (v95)' | git commit-tree "$tree" -p "$BASE")
          git push origin "$candidate:refs/heads/repair/expand-only-candidate-v95"
          echo "$candidate" > "$RUNNER_TEMP/gate-report/candidate-sha.txt"
          git diff --stat "$BASE" "$candidate" > "$RUNNER_TEMP/gate-report/diff-stat.txt"
      - name: Save verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expand-only-v95-verification
          path: ${{ runner.temp }}/gate-report
          retention-days: 7
