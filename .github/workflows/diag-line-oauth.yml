name: Verify LINE OAuth2 redirect
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/diag-line-oauth.yml
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Supabase OAuth2 authorize redirect
        run: |
          set -euo pipefail
          curl --silent --show-error --get --dump-header headers.txt --output /dev/null \
            --data-urlencode 'provider=custom:line' \
            --data-urlencode 'redirect_to=https://sonia6891.github.io/https-github.com-facebook-facebook-ios-sdk/' \
            'https://ygrlvmyqrhyfkglomsbq.supabase.co/auth/v1/authorize'
          python3 - <<'PY'
          from urllib.parse import urlparse,parse_qs
          lines=open('headers.txt',encoding='utf-8').read().splitlines()
          loc=[x.split(':',1)[1].strip() for x in lines if x.lower().startswith('location:')][-1]
          q=parse_qs(urlparse(loc).query)
          keep={k:q.get(k) for k in ['client_id','redirect_uri','response_type','scope','state','code_challenge','code_challenge_method']}
          for k in ['state','code_challenge']:
              if keep.get(k): keep[k]=['<present>']
          print(keep)
          assert q.get('redirect_uri'), loc
          assert q.get('code_challenge'), 'missing code_challenge'
          assert q.get('code_challenge_method')==['S256'], q.get('code_challenge_method')
          PY
