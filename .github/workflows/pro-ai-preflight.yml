name: Pro payroll intelligence preflight
on:
  push:
    branches: [main]
    paths:
      - index.html
      - tests/pro-ai-v125.cjs
      - supabase/functions/pro-ai/index.ts
      - supabase/functions/payslip-verify/index.ts
      - supabase/migrations/**
      - docs/pro-ai-**
      - .github/workflows/pro-ai-preflight.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Parse application JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          html=Path('index.html').read_text()
          scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',html,re.I)
          for i,src in enumerate(scripts):
              p=Path(tempfile.gettempdir())/f'meow-payroll-inline-{i}.js'
              p.write_text(src)
              subprocess.run(['node','--check',str(p)],check=True)
          print(f'{len(scripts)} inline scripts parsed')
          PY
      - name: Local payroll intelligence regression checks
        run: node tests/pro-ai-v125.cjs
      - name: Secret leak guard
        run: |
          if grep -R --line-number --exclude-dir=.git -E 'sk-[A-Za-z0-9_-]{20,}' index.html supabase docs tests; then
            echo "Possible API secret committed to repository"
            exit 1
          fi
          echo "No API key literal detected"
