name: Verify compact mobile schedule card v97
on:
  push:
    branches: ["repair/compact-card-v96"]
permissions:
  contents: write
concurrency:
  group: compact-card-v96
  cancel-in-progress: true
env:
  BASE: 78f07fcea219f8aed58442f46bb2352d28465275
  LIVE_URL: ""
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated browser tests
        run: |
          python -m pip install playwright==1.55.0 pillow
          python -m playwright install --with-deps chromium webkit
      - name: Build CSS-only change on latest annual-leave release
        run: |
          mkdir -p "$RUNNER_TEMP/compact-before" "$RUNNER_TEMP/compact-after" "$RUNNER_TEMP/compact-report"
          git archive "$BASE" | tar -x -C "$RUNNER_TEMP/compact-before"
          cp -a "$RUNNER_TEMP/compact-before/." "$RUNNER_TEMP/compact-after/"
          python maintenance/compact_v97.py "$RUNNER_TEMP/compact-after"
      - name: Wait for exact tested source when verifying live site
        if: env.LIVE_URL != ''
        run: |
          python - <<'PY'
          import os,time,hashlib,urllib.request
          expected='0c19b4c23b874736f9f36ac9ef3fb2a282cbdd522b5a40b4167d5c10ba0a67ec'
          for attempt in range(24):
            try:
              with urllib.request.urlopen(urllib.request.Request(os.environ['LIVE_URL'],headers={'Cache-Control':'no-cache'}),timeout=15) as r:
                if r.status==200 and hashlib.sha256(r.read()).hexdigest()==expected:
                  print('Exact tested source is published')
                  break
            except Exception as e:
              print(type(e).__name__)
            time.sleep(5)
          else:
            raise SystemExit('Published source does not match tested files')
          PY
      - name: Verify saved space, desktop parity and edit gating
        run: |
          python maintenance/test_compact_v96.py "$RUNNER_TEMP/compact-before" "$RUNNER_TEMP/compact-after" "$RUNNER_TEMP/compact-report"
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'],'compact-report/report.json')
          report=json.loads(p.read_text());report['version']=97;report['preserves_annual_leave_release']=True
          p.write_text(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - name: Create tested candidate without updating main
        if: env.LIVE_URL == ''
        run: |
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          export GIT_INDEX_FILE="$RUNNER_TEMP/compact-index"
          git read-tree "$BASE"
          for path in index.html sw.js; do
            blob=$(git hash-object -w "$RUNNER_TEMP/compact-after/$path")
            git update-index --add --cacheinfo "100644,$blob,$path"
          done
          tree=$(git write-tree)
          git config user.name 'sonia6891'
          git config user.email '107385898+sonia6891@users.noreply.github.com'
          candidate=$(printf '%s\n' 'Compact mobile schedule card and preserve latest annual leave update (v97)' | git commit-tree "$tree" -p "$BASE")
          git push origin "$candidate:refs/heads/repair/compact-card-candidate-v97"
          echo "$candidate" > "$RUNNER_TEMP/compact-report/candidate-sha.txt"
          git diff --stat "$BASE" "$candidate" > "$RUNNER_TEMP/compact-report/diff-stat.txt"
      - name: Save screenshots and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compact-card-v97-verification
          path: ${{ runner.temp }}/compact-report
          retention-days: 7
