name: Verify overtime rates v98
on:
  push:
    branches: ["feature/overtime-rates-v98"]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and verify
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          git archive 85bd25f74742414d57e6e3c3b0c006177f63f056 | tar -x -C "$RUNNER_TEMP/site"
          python maintenance/apply_overtime_v98.py "$RUNNER_TEMP/site"
          python - <<'PY'
          import re,pathlib,subprocess,os
          s=pathlib.Path(os.environ['RUNNER_TEMP'],'site/index.html').read_text()
          for x in ['加班費率','勞基法標準','固定倍率','公司自訂','dialogOvertimeKind','monthlyOvertimePay']:
              assert x in s,x
          js=re.findall(r'<script[^>]*>([\\s\\S]*?)</script>',s)[-1]
          f=pathlib.Path(os.environ['RUNNER_TEMP'],'app.js');f.write_text(js)
          subprocess.run(['node','--check',str(f)],check=True)
          PY
          python - <<'PY'
          from fractions import Fraction
          h=150
          assert h*Fraction(4,3)*2+h*Fraction(5,3)==650
          assert h*Fraction(4,3)*2+h*Fraction(5,3)*6==1900
          assert h*Fraction(4,3)*2+h*Fraction(5,3)*6+h*Fraction(8,3)*2==2700
          print('overtime formula checks passed')
          PY
      - name: Publish tested candidate
        run: |
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "85bd25f74742414d57e6e3c3b0c006177f63f056"
          export GIT_INDEX_FILE="$RUNNER_TEMP/index"
          git read-tree 85bd25f74742414d57e6e3c3b0c006177f63f056
          for path in index.html sw.js; do
            blob=$(git hash-object -w "$RUNNER_TEMP/site/$path")
            git update-index --add --cacheinfo "100644,$blob,$path"
          done
          tree=$(git write-tree)
          git config user.name 'sonia6891'
          git config user.email '107385898+sonia6891@users.noreply.github.com'
          candidate=$(printf '%s\n' 'Add selectable overtime rate rules and segmented calculations (v98)' | git commit-tree "$tree" -p 85bd25f74742414d57e6e3c3b0c006177f63f056)
          git push origin "$candidate:refs/heads/feature/overtime-rates-candidate-v98"
