name: Verify conservative cleanup v89
on:
  push:
    branches: ["cleanup/audit-20260922-v89"]
permissions:
  contents: write
concurrency:
  group: cleanup-v89-audit
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BASE: 022840b11e3ac83758440cc73b2bbb4b0dd02e8b
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install tinycss2==1.4.0 beautifulsoup4==4.13.5 Pillow==11.3.0 playwright==1.55.0
          python -m playwright install --with-deps chromium webkit
      - name: Prepare isolated source worktrees
        run: |
          git worktree add --detach /tmp/meow-before "$BASE"
          git worktree add --detach /tmp/meow-after "$BASE"
          mkdir -p /tmp/meow-cleanup-report
          python .cleanup_tools/cleanup.py /tmp/meow-after /tmp/meow-cleanup-report/cleanup.json
      - name: Verify UI, data and fallback behavior
        run: python .cleanup_tools/check.py /tmp/meow-before /tmp/meow-after /tmp/meow-cleanup-report
      - name: Create verified candidate, without editing main
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          git -C /tmp/meow-after config user.name 'github-actions[bot]'
          git -C /tmp/meow-after config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C /tmp/meow-after add -A
          TREE=$(git -C /tmp/meow-after write-tree)
          CANDIDATE=$(printf 'Remove unused assets and dead UI code; retain latest Pro features (cleanup v89)\n' | git -C /tmp/meow-after commit-tree "$TREE" -p "$BASE")
          git push origin "$CANDIDATE:refs/heads/cleanup/verified-20260922-v89"
          printf '{"base":"%s","tree":"%s","commit":"%s"}\n' "$BASE" "$TREE" "$CANDIDATE" > /tmp/meow-cleanup-report/candidate.json
      - name: Upload cleanup proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meow-cleanup-v89-verification
          path: /tmp/meow-cleanup-report
          retention-days: 7
