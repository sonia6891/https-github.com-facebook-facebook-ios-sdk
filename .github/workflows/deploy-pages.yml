name: Deploy static site to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Theme regression checks
        run: node tests/theme-persistence.test.cjs
      - name: Install browser tests
        run: |
          npm install --no-save playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Google, LINE, Free access, logout and mobile layout tests
        run: node tests/browser-account-v117.cjs
      - name: Verify live LINE provider redirect and scopes
        run: |
          set -euo pipefail
          curl --silent --show-error --get --dump-header line-auth-headers.txt --output /dev/null \
            --data-urlencode 'provider=custom:line' \
            --data-urlencode 'redirect_to=https://sonia6891.github.io/https-github.com-facebook-facebook-ios-sdk/' \
            'https://ygrlvmyqrhyfkglomsbq.supabase.co/auth/v1/authorize'
          python3 - <<'PY'
          from urllib.parse import urlparse,parse_qs
          headers=open('line-auth-headers.txt',encoding='utf-8').read().splitlines()
          status=headers[0] if headers else ''
          locations=[line.split(':',1)[1].strip() for line in headers if line.lower().startswith('location:')]
          assert '302' in status or '303' in status, status
          assert locations, 'missing LINE redirect'
          parsed=urlparse(locations[-1])
          assert parsed.netloc=='access.line.me', locations[-1]
          scopes=' '.join(parse_qs(parsed.query).get('scope',[]))
          assert 'openid' in scopes.split() and 'profile' in scopes.split(), scopes
          assert '、' not in scopes, scopes
          print('LINE provider redirect verified:',parsed.netloc,scopes)
          PY
      - name: Stage public application files only
        run: |
          mkdir -p _site
          cp index.html sw.js manifest.webmanifest 404.html workcat-home-v12.png app-icon-v115-180.png app-icon-v115-192.png app-icon-v115-512.png _site/
          cp -R assets _site/assets
          touch _site/.nojekyll
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published application and provider availability
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,re,time,urllib.request
          result={'commit':os.environ['GITHUB_SHA'],'files':{}}
          base=os.environ['PAGE_URL']
          for name in ['index.html','sw.js','manifest.webmanifest','app-icon-v115-180.png','app-icon-v115-192.png','app-icon-v115-512.png','assets/welcome-brand-v112.webp']:
              expected=hashlib.sha256(Path(name).read_bytes()).hexdigest()
              url=base+name+'?build-check='+os.environ['GITHUB_SHA']
              for attempt in range(10):
                  try:
                      request=urllib.request.Request(url,headers={'Cache-Control':'no-cache'})
                      with urllib.request.urlopen(request,timeout=20) as response:
                          actual=hashlib.sha256(response.read()).hexdigest()
                      assert actual==expected, 'Published file does not match build: '+name
                      result['files'][name]=actual
                      break
                  except Exception:
                      if attempt==9: raise
                      time.sleep(3)
          html=Path('index.html').read_text()
          assert 'v121-pwa-auth-persistence' in html
          assert "const WELCOME_REAUTH_KEY='meow-work-welcome-reauth-v1'" in html
          assert "const LINE_PROVIDER_ID='custom:line'" in html
          assert "scopes:'openid profile'" in html
          assert "skipBrowserRedirect=true" in html
          assert "window.open('about:blank','meow-auth-window')" in html
          assert 'id="welcomeGuest"' not in html
          assert 'id="welcomeEmail"' not in html
          assert html.index('id="profilePreview"') < html.index('id="accountPlanCard"') < html.index('id="workSettingsCard"') < html.index('id="dataSyncCard"') < html.index('id="installCard"') < html.index('id="aboutCard"') < html.index('id="settingsFooterBanner"')
          assert html.index('id="accountPlanCard"') < html.index('id="proPlanSettings"') < html.index('id="workSettingsCard"')
          assert 'id="toggleWorkSettings"' in html and 'id="workSettingsBody"' in html
          assert 'id="toggleDataSync"' in html and 'id="dataSyncBody"' in html
          assert 'id="accountEmail"' not in html
          assert 'id="accountLoginMethod"' in html and 'id="accountUsername"' in html
          assert 'id="devPlanCard"' not in html
          assert '.bottom-nav{position:fixed!important;' in html
          assert "from('user_legacy_exports').select('payload,original_updated_at')" in html
          api=re.search(r"const SUPABASE_URL='([^']+)'",html).group(1)
          key=re.search(r"const SUPABASE_KEY='([^']+)'",html).group(1)
          try:
              req=urllib.request.Request(api+'/auth/v1/settings',headers={'apikey':key})
              with urllib.request.urlopen(req,timeout=15) as response:
                  cfg=json.load(response)
              ext=cfg.get('external',{})
              result['login_providers']={'google':bool(ext.get('google')),'line_custom_oidc':'custom:line' in html}
          except Exception as error:
              result['provider_check_error']=type(error).__name__
          result['published_files_verified']=True
          Path('test-results/published-build.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result,indent=2))
          PY
      - name: Save verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meow-v121-pwa-auth-persistence-verification
          path: test-results/
          retention-days: 3
