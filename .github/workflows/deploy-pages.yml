name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Run theme regression tests
        run: node tests/theme-persistence.test.cjs
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published build
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, os, time, urllib.request
          expected=hashlib.sha256(Path('index.html').read_bytes()).hexdigest()
          url=os.environ['PAGE_URL']+'?build-check='+os.environ['GITHUB_SHA']
          for attempt in range(10):
              try:
                  request=urllib.request.Request(url,headers={'Cache-Control':'no-cache'})
                  with urllib.request.urlopen(request,timeout=20) as response:
                      actual=hashlib.sha256(response.read()).hexdigest()
                  assert actual==expected, 'Published index.html does not match this build yet'
                  print('Published build verified:',os.environ['GITHUB_SHA'],expected)
                  break
              except Exception:
                  if attempt==9: raise
                  time.sleep(3)
          PY
