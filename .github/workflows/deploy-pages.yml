name: Deploy static site to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-production-v129
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Theme regression checks
        run: node tests/theme-persistence.test.cjs
      - name: v129 schedule and settings UI checks
        run: node tests/ui-v129.test.cjs
      - name: v156 cloud sync hardening checks
        run: node tests/cloud-sync-v156.test.cjs
      - name: Meow Assistant core regression
        run: node tests/meow-assistant-round2-100.test.cjs
      - name: Meow Assistant OpenAI NLU integration contract
        run: node tests/meow-assistant-ai-nlu.test.cjs
      - name: Meow Assistant multi-turn conversation memory
        run: node tests/meow-assistant-conversation-memory.test.cjs
      - name: Meow Assistant contextual operation safety
        run: node tests/meow-assistant-contextual-operations.test.cjs
      - name: Meow Assistant multi-turn stateful E2E
        run: node tests/meow-assistant-multiturn-e2e.test.cjs
      - name: Meow Assistant multi-turn fuzz — 1000 stateful turns
        run: node tests/meow-assistant-multiturn-fuzz-1000.test.cjs
      - name: Meow Assistant live OpenAI semantic quality harness contract
        run: node tests/meow-assistant-live-quality-harness.test.cjs
      - name: Meow Assistant live OpenAI failure classification
        run: node tests/meow-assistant-live-failure-classification.test.cjs
      - name: Meow Assistant live OpenAI repair hints
        run: node tests/meow-assistant-live-repair-hints.test.cjs
      - name: Meow Assistant multi-intent response composition
        run: node tests/meow-assistant-multi-intent-response.test.cjs
      - name: Meow Assistant Taiwan labor knowledge base
        run: node tests/meow-assistant-labor-kb.test.cjs

      - name: Meow Assistant leave-law and minimum-wage routing
        run: node tests/meow-assistant-leave-law.test.cjs
      - name: Meow Assistant natural-language discovery baseline
        run: node tests/meow-assistant-auto-discovery.test.cjs
      - name: Install browser tests
        run: |
          npm install --no-save playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Google, LINE, Free access, logout and mobile layout tests
        run: node tests/browser-account-v117.cjs
      - name: Verify live LINE provider redirect and scopes
        run: |
          set -euo pipefail
          curl --silent --show-error --get --dump-header line-auth-headers.txt --output /dev/null \
            --data-urlencode 'provider=custom:line' \
            --data-urlencode 'redirect_to=https://sonia6891.github.io/meow-work-app/' \
            'https://ygrlvmyqrhyfkglomsbq.supabase.co/auth/v1/authorize'
          python3 - <<'PY'
          from urllib.parse import urlparse,parse_qs
          headers=open('line-auth-headers.txt',encoding='utf-8').read().splitlines()
          status=headers[0] if headers else ''
          locations=[line.split(':',1)[1].strip() for line in headers if line.lower().startswith('location:')]
          assert '302' in status or '303' in status, status
          assert locations, 'missing LINE redirect'
          parsed=urlparse(locations[-1])
          assert parsed.netloc=='access.line.me', locations[-1]
          scopes=' '.join(parse_qs(parsed.query).get('scope',[]))
          assert 'openid' in scopes.split() and 'profile' in scopes.split(), scopes
          assert '、' not in scopes, scopes
          disable_auto=' '.join(parse_qs(parsed.query).get('disable_auto_login',[]))
          assert disable_auto=='true', disable_auto
          print('LINE provider redirect verified:',parsed.netloc,scopes,'disable_auto_login='+disable_auto)
          PY
      - name: Generate valid web home-screen icons and splash
        run: |
          set -euo pipefail
          ICON_VENV="$RUNNER_TEMP/meow-icon-venv"
          python3 -m venv "$ICON_VENV"
          "$ICON_VENV/bin/python" -m pip install --quiet pillow
          "$ICON_VENV/bin/python" native/scripts/generate-app-icons-v155.py
          curl -L --fail --retry 3 "https://cdn.openart.ai/openart-uploads/production/attachment-transfers/55737aaf2c45506d5e29d823d614db2626d1ad79dd3ea82806858d64c267a2bc.png" -o icon-v178-source.png
          curl -L --fail --retry 3 "https://cdn.openart.ai/openart-uploads/production/attachment-transfers/b8ccc9163e5d72861ccb895c9425ea26942dcbc01b1f112860ca39e8cc48795c.png" -o splash-v183-source.png
          "$ICON_VENV/bin/python" - <<'PY'
          from PIL import Image, ImageOps, ImageFilter
          from pathlib import Path

          icon=Image.open('icon-v178-source.png').convert('RGB')
          # Use the final frameless icon source; the platform supplies the only outer rounded mask.
          for size in (180,192,512):
              out=ImageOps.fit(icon,(size,size),method=Image.Resampling.LANCZOS)
              out.save(f'app-icon-v178-{size}.png',format='PNG',optimize=True)

          # Use the exact approved final splash artwork. No extra mirroring, zooming or synthetic sky.
          splash=Image.open('splash-v183-source.png').convert('RGB')
          splash.save('splash-v183.jpg',format='JPEG',quality=92,optimize=True,progressive=True)

          for name,size in [('app-icon-v178-180.png',(180,180)),('app-icon-v178-192.png',(192,192)),('app-icon-v178-512.png',(512,512))]:
              im=Image.open(name)
              assert im.size==size, (name,im.size)
              assert im.mode in ('RGB','P'), (name,im.mode)
          im=Image.open('splash-v183.jpg')
          assert im.width>=900 and im.height>=1600
          print('v183 brand assets valid:',[(p.name,p.stat().st_size) for p in map(Path,['app-icon-v178-180.png','app-icon-v178-192.png','app-icon-v178-512.png','splash-v183.jpg'])])
          PY
      - name: Stage public application files only
        run: |
          mkdir -p _site
          cp index.html privacy.html terms.html support.html sw.js manifest.webmanifest 404.html workcat-home-v12.png app-icon-v155-180.png app-icon-v155-192.png app-icon-v155-512.png app-icon-v178-180.png app-icon-v178-192.png app-icon-v178-512.png splash-v183.jpg _site/
          cp -R assets _site/assets
          touch _site/.nojekyll
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published application and provider availability
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,re,time,urllib.request,urllib.error
          result={'commit':os.environ['GITHUB_SHA'],'files':{}}
          base=os.environ['PAGE_URL']
          for name in ['index.html','privacy.html','terms.html','support.html','sw.js','manifest.webmanifest','app-icon-v155-180.png','app-icon-v155-192.png','app-icon-v155-512.png','app-icon-v178-180.png','app-icon-v178-192.png','app-icon-v178-512.png','splash-v183.jpg','assets/welcome-brand-v112.webp','assets/meow-assistant-pro-v169.webp']:
              expected=hashlib.sha256(Path(name).read_bytes()).hexdigest()
              url=base+name+'?build-check='+os.environ['GITHUB_SHA']
              for attempt in range(10):
                  try:
                      request=urllib.request.Request(url,headers={'Cache-Control':'no-cache'})
                      with urllib.request.urlopen(request,timeout=20) as response:
                          actual=hashlib.sha256(response.read()).hexdigest()
                      assert actual==expected, 'Published file does not match build: '+name
                      result['files'][name]=actual
                      break
                  except Exception:
                      if attempt==9: raise
                      time.sleep(3)
          import struct
          def png_size(path):
              data=Path(path).read_bytes()
              assert data[:8]==b'\x89PNG\r\n\x1a\n', path
              return struct.unpack('>II',data[16:24])
          for name,size in [('app-icon-v178-180.png',(180,180)),('app-icon-v178-192.png',(192,192)),('app-icon-v178-512.png',(512,512))]:
              assert png_size(name)==size, (name,png_size(name))
          jpg=Path('splash-v183.jpg').read_bytes()
          assert jpg[:2]==b'\xff\xd8' and jpg[-2:]==b'\xff\xd9', 'invalid splash jpeg'
          mascot=Path('assets/meow-assistant-pro-v169.webp').read_bytes()
          assert len(mascot)>9000, 'Meow Assistant asset unexpectedly small/truncated'
          assert mascot[:4]==b'RIFF' and mascot[8:12]==b'WEBP', 'Meow Assistant asset is not valid WebP'
          html=Path('index.html').read_text()
          import re
          m=re.search(r'<meta name="meow-ui-build" content="v(\d+)[^"]*">',html)
          assert m and int(m.group(1))>=129, 'expected app build v129 or newer'
          assert "const WELCOME_REAUTH_KEY='meow-work-welcome-reauth-v1'" in html
          assert "const LINE_PROVIDER_ID='custom:line'" in html
          assert "scopes:'openid profile'" in html
          assert '3 天免費試用' in html
          assert 'NT$99' in html and 'NT$790' in html
          assert 'App Store／Google Play' in html
          assert "create-ecpay-checkout" not in html
          assert "start-pro-trial" not in html
          assert "window.MeowStoreBilling" in html
          assert "verify-app-store-transaction" in html
          assert "appAccountToken:authUser.id" in html
          assert "restoreStorePurchases" in html
          assert 'id="restoreStorePurchases"' in html
          assert "finishVerifiedStoreTransaction" in html
          assert "getUnfinishedTransactions" in html
          assert "transactionUpdated" in html
          assert "syncUnfinishedStoreTransactions" in html
          assert "loadNativeStoreProducts" in html
          assert "storeDisplayPrice" in html
          assert "eligibleForIntroOffer" in html
          assert 'id="proTrialOfferHint"' in html
          assert 'id="deleteAccount"' in html
          assert "invokeUserFunction('delete-account'" in html
          assert 'href="./privacy.html"' in html
          assert 'href="./terms.html"' in html
          assert 'href="./support.html"' in html
          assert 'class="auth-booting"' in html
          assert "window.open('about:blank','meow-auth-window')" not in html
          assert "client.auth.setSession({" not in html
          assert 'id="welcomeGuest"' not in html
          assert 'id="welcomeEmail"' not in html
          assert html.index('id="profilePreview"') < html.index('id="accountPlanCard"') < html.index('id="appearanceCard"') < html.index('id="workSettingsCard"') < html.index('id="dataSyncCard"') < html.index('id="installCard"') < html.index('id="aboutCard"')
          assert html.index('id="profilePreview"') < html.index('id="accountPlanCard"') < html.index('id="proPlanSettings"') < html.index('id="appearanceCard"')
          assert 'id="toggleWorkSettings"' in html and 'id="workSettingsBody"' in html
          assert 'id="toggleDataSync"' in html and 'id="dataSyncBody"' in html
          assert 'Free・本機保存' in html and 'Pro・本機＋雲端' in html
          assert "async function backupCloudNow(showAlert=true)" in html
          assert "return await restoreLegacyCloud()" in html
          assert 'id="accountEmail"' not in html
          assert 'id="accountLoginMethod"' in html and 'id="accountUsername"' in html
          assert 'id="devPlanCard"' not in html
          assert '.bottom-nav{position:fixed!important;' in html
          assert "from('user_legacy_exports').select('payload,original_updated_at')" in html
          api=re.search(r"const SUPABASE_URL='([^']+)'",html).group(1)
          key=re.search(r"const SUPABASE_KEY='([^']+)'",html).group(1)
          with urllib.request.urlopen(api+'/functions/v1/billing-config',timeout=15) as response:
              billing=json.load(response)
          assert billing.get('provider')=='app_store_play', billing
          assert billing.get('trial_days')==3, billing
          assert billing.get('monthly')==99 and billing.get('yearly')==790, billing
          result['billing_config']=billing
          verify_req=urllib.request.Request(api+'/functions/v1/verify-app-store-transaction',data=b'{}',method='POST',headers={'Content-Type':'application/json'})
          try:
              urllib.request.urlopen(verify_req,timeout=15)
              raise AssertionError('verify-app-store-transaction should reject anonymous request')
          except urllib.error.HTTPError as error:
              assert error.code==401, error.code
          notify_req=urllib.request.Request(api+'/functions/v1/app-store-notifications-v2',data=b'{}',method='POST',headers={'Content-Type':'application/json'})
          try:
              urllib.request.urlopen(notify_req,timeout=15)
              raise AssertionError('app-store-notifications-v2 should reject missing signedPayload')
          except urllib.error.HTTPError as error:
              assert error.code==400, error.code
          delete_req=urllib.request.Request(api+'/functions/v1/delete-account',data=b'{}',method='POST',headers={'Content-Type':'application/json'})
          try:
              urllib.request.urlopen(delete_req,timeout=15)
              raise AssertionError('delete-account should reject anonymous request')
          except urllib.error.HTTPError as error:
              assert error.code==401, error.code
          speech_req=urllib.request.Request(api+'/functions/v1/speech-transcribe',data=b'{}',method='POST',headers={'Content-Type':'application/json'})
          try:
              urllib.request.urlopen(speech_req,timeout=15)
              raise AssertionError('speech-transcribe should reject anonymous request')
          except urllib.error.HTTPError as error:
              assert error.code==401, error.code
          result['apple_functions_online']=True
          result['account_deletion_online']=True
          result['speech_transcription_online']=True
          try:
              req=urllib.request.Request(api+'/auth/v1/settings',headers={'apikey':key})
              with urllib.request.urlopen(req,timeout=15) as response:
                  cfg=json.load(response)
              ext=cfg.get('external',{})
              result['login_providers']={'google':bool(ext.get('google')),'apple':bool(ext.get('apple')),'line_custom_oidc':'custom:line' in html}
          except Exception as error:
              result['provider_check_error']=type(error).__name__
          result['published_files_verified']=True
          Path('test-results/published-build.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result,indent=2))
          PY
      - name: Save verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meow-v129-settings-schedule-ui-verification
          path: test-results/
          retention-days: 3
