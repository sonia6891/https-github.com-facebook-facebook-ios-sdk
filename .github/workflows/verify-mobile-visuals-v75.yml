name: Verify mobile source assets v75
on:
  push:
    branches: ["repair/mobile-visuals-v75"]
permissions:
  contents: write
concurrency:
  group: mobile-visual-verification-v75
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verification tools
        run: |
          python -m pip install Pillow==11.3.0 tinycss2==1.4.0 playwright==1.55.0
          python -m playwright install --with-deps chromium webkit
      - name: Prepare isolated before and after copies
        run: |
          git worktree add --detach /tmp/meow-before 5477916a4171c4f78022e315b9a42f855be483a5
          git worktree add --detach /tmp/meow-after 5477916a4171c4f78022e315b9a42f855be483a5
          python .repair/apply_visual_repair.py /tmp/meow-after .repair/footer.webp
      - name: Verify five mobile pages and unchanged desktop
        run: python .repair/verify_visual_repair.py /tmp/meow-before /tmp/meow-after /tmp/meow-qa
      - name: Publish tested candidate branch only
        run: |
          git -C /tmp/meow-after config user.name 'github-actions[bot]'
          git -C /tmp/meow-after config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C /tmp/meow-after add index.html 404.html sw.js mobile-rest-card-v1.jpg mobile-hero-clean-v75.png ui-visual-release.json
          git -C /tmp/meow-after commit -m 'Repair mobile image sources and consolidate visual controls'
          git -C /tmp/meow-after push origin HEAD:refs/heads/repair/mobile-visuals-v75-ready
          echo "TESTED_CANDIDATE=$(git -C /tmp/meow-after rev-parse HEAD)"
          cat /tmp/meow-qa/result.json >> "$GITHUB_STEP_SUMMARY"
      - name: Save visual verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-visuals-v75-verification
          path: |
            /tmp/meow-qa
            /tmp/meow-after/ui-visual-release.json
          if-no-files-found: warn
