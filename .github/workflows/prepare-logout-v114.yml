name: Prepare and verify logout welcome v114
on:
  push:
    branches: [fix/logout-welcome-v114]
permissions:
  contents: write
concurrency:
  group: prepare-logout-v114
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated fix branch
        uses: actions/checkout@v6
        with:
          ref: fix/logout-welcome-v114
      - name: Apply guarded reauthentication change
        run: python3 tools/apply-logout-welcome-v114.py
      - name: Theme regression checks
        run: node tests/theme-persistence.test.cjs
      - name: Install browser tests
        run: |
          python3 -m pip install playwright==1.57.0
          python3 -m playwright install --with-deps chromium
      - name: Existing welcome and cloud access regression tests
        run: python3 tests/browser-v112.py
      - name: Existing framed welcome regression tests
        run: python3 tests/browser-frame-v113.py
      - name: Logout and re-login regression tests
        run: python3 tests/browser-logout-v114.py
      - name: Commit verified source and remove temporary workflow
        run: |
          git add index.html sw.js
          git rm .github/workflows/prepare-logout-v114.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Show framed login after logout and preserve remembered sessions (v114)'
          git push origin HEAD:fix/logout-welcome-v114
          git rev-parse HEAD > test-results/verified-commit.txt
      - name: Save preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logout-welcome-v114-preflight
          path: test-results/
          retention-days: 3
