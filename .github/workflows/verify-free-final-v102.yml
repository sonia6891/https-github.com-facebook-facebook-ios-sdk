name: Verify Free final formula v102
on:
  push:
    branches: ["fix/free-final-formula-v102"]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Build and verify
        run: |
          mkdir -p "$RUNNER_TEMP/site"; git archive 275d448e5a67915c23b86a039a6d3e9d27a25e20 | tar -x -C "$RUNNER_TEMP/site"
          python maintenance/apply_free_final_v102.py "$RUNNER_TEMP/site"
          python - <<'PY'
          import re,pathlib,subprocess,os
          s=pathlib.Path(os.environ['RUNNER_TEMP'],'site/index.html').read_text()
          for x in ['function overtimeFormulaDetail','本期已使用特休時數（補登）','今年已使用病假時數（補登）','今年已使用事假時數（補登）','v=102']:assert x in s,x
          js=re.findall(r'<script[^>]*>([\\s\\S]*?)</script>',s)[-1];f=pathlib.Path(os.environ['RUNNER_TEMP'],'app.js');f.write_text(js);subprocess.run(['node','--check',str(f)],check=True)
          PY
      - name: Publish candidate
        run: |
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "275d448e5a67915c23b86a039a6d3e9d27a25e20"
          export GIT_INDEX_FILE="$RUNNER_TEMP/index";git read-tree 275d448e5a67915c23b86a039a6d3e9d27a25e20
          for path in index.html sw.js; do blob=$(git hash-object -w "$RUNNER_TEMP/site/$path");git update-index --add --cacheinfo "100644,$blob,$path";done
          tree=$(git write-tree);git config user.name sonia6891;git config user.email 107385898+sonia6891@users.noreply.github.com
          candidate=$(printf '%s\n' 'Add dynamic overtime formula details (v102)' | git commit-tree "$tree" -p 275d448e5a67915c23b86a039a6d3e9d27a25e20)
          git push origin "$candidate:refs/heads/fix/free-final-formula-candidate-v102"
