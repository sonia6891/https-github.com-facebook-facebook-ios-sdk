<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#edf6ff">
<meta name="application-name" content="安好">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="安好">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="./manifest.webmanifest?v=1">
<link rel="icon" href="./icon.svg?v=1" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon.svg?v=1">
<title>安好｜家人安心守護</title>
<style>
:root{--navy:#123457;--muted:#71869e;--blue:#428cf4;--aqua:#28c6c3;--green:#41c98a;--red:#ff6570;--orange:#f7a94a;--line:rgba(24,70,113,.09);--shadow:0 18px 44px rgba(48,95,142,.13);--shadow2:0 7px 20px rgba(31,91,150,.10)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Noto Sans TC","Microsoft JhengHei",sans-serif;background:#edf5fd;color:var(--navy)}
body{overscroll-behavior-y:none}
button{font:inherit}
.app{min-height:100vh;min-height:100dvh;max-width:520px;margin:auto;background:
radial-gradient(circle at 80% 6%,rgba(84,161,245,.18),transparent 29%),
linear-gradient(180deg,#f7fbff 0%,#edf6ff 44%,#f8fbff 100%);position:relative;overflow:hidden;padding-bottom:96px}
.ambient{position:absolute;inset:0 0 auto;height:340px;pointer-events:none;overflow:hidden}
.ambient:before,.ambient:after{content:"";position:absolute;border-radius:999px;filter:blur(3px)}
.ambient:before{width:360px;height:190px;background:linear-gradient(135deg,rgba(255,255,255,.92),rgba(111,185,244,.12));right:-90px;top:72px;transform:rotate(-14deg)}
.ambient:after{width:320px;height:150px;background:linear-gradient(135deg,rgba(63,142,236,.08),rgba(255,255,255,.0));left:-90px;top:165px;transform:rotate(12deg)}
.header{position:relative;z-index:2;padding:calc(18px + env(safe-area-inset-top)) 20px 10px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand h1{margin:0;font-size:38px;line-height:1;font-weight:780;letter-spacing:-1.6px;color:#11365b}
.brand p{margin:8px 0 0;color:#7890aa;font-size:14px;font-weight:600}
.account{display:flex;align-items:center;gap:10px}
.bell{width:40px;height:40px;border:0;border-radius:16px;background:rgba(255,255,255,.72);box-shadow:var(--shadow2);display:grid;place-items:center;color:#547693;position:relative}
.bell:after{content:"";width:8px;height:8px;background:#ff655c;border:2px solid white;border-radius:50%;position:absolute;right:6px;top:5px}
.avatar{width:43px;height:43px;border-radius:50%;background:linear-gradient(145deg,#c8ddf1,#fff);border:3px solid rgba(255,255,255,.9);box-shadow:var(--shadow2);display:grid;place-items:center;font-size:23px}
.greeting{display:flex;align-items:flex-end;justify-content:space-between;margin-top:26px;gap:12px}
.greeting strong{font-size:18px;line-height:1.45}
.greeting small{display:block;margin-top:3px;color:#7590ab;font-weight:650}
.date{font-size:12px;color:#7990a8;text-align:right;font-weight:700;white-space:nowrap}
.status{margin:16px 18px 0;position:relative;z-index:2;border:1px solid rgba(255,255,255,.88);border-radius:28px;padding:18px;background:linear-gradient(135deg,rgba(255,255,255,.90),rgba(237,248,255,.68));box-shadow:var(--shadow);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);overflow:hidden}
.status:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(53,194,190,.16),transparent 68%);right:-52px;top:-55px}
.status-main{display:flex;align-items:center;gap:15px;position:relative;z-index:1}
.check{width:74px;height:74px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#84f0d9,#29c6a4 61%,#18aa95);box-shadow:0 9px 24px rgba(37,194,164,.30),inset 0 0 0 8px rgba(255,255,255,.18);display:grid;place-items:center;flex:0 0 auto}
.check svg{width:35px;height:35px}
.status-copy{min-width:0;flex:1}
.status-copy h2{font-size:25px;letter-spacing:-.5px;margin:0 0 5px;font-weight:850}
.status-copy p{margin:0;color:#627e9b;font-size:13px;font-weight:650}
.pill{margin-top:9px;display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border-radius:999px;background:#dff8f2;color:#18856e;font-size:12px;font-weight:800}
.arrow{width:37px;height:37px;border-radius:50%;background:rgba(255,255,255,.7);display:grid;place-items:center;color:#65829d;border:1px solid rgba(31,92,149,.07);flex:0 0 auto}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;padding:16px 18px 0;position:relative;z-index:2}
.action{border:1px solid rgba(255,255,255,.85);min-width:0;padding:13px 4px 12px;border-radius:22px;background:rgba(255,255,255,.73);box-shadow:var(--shadow2);text-align:center;color:var(--navy)}
.action-icon{width:48px;height:48px;margin:0 auto 8px;border-radius:17px;display:grid;place-items:center;color:white;box-shadow:inset 0 0 0 1px rgba(255,255,255,.32)}
.action-icon svg{width:24px;height:24px}
.action b{display:block;font-size:13px;white-space:nowrap}
.action span{display:block;font-size:10px;color:#8092a7;margin-top:3px;white-space:nowrap}
.sos .action-icon{background:linear-gradient(145deg,#ff7e86,#ff5361)} .video .action-icon{background:linear-gradient(145deg,#6ab3ff,#3c83f5)}
.med .action-icon{background:linear-gradient(145deg,#ffc066,#f59c35)} .loc .action-icon{background:linear-gradient(145deg,#42d7d3,#20b9ba)}
.card{margin:16px 18px 0;border-radius:27px;background:rgba(255,255,255,.83);border:1px solid rgba(255,255,255,.9);box-shadow:var(--shadow2);padding:17px;position:relative;z-index:2;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.title{font-size:17px;font-weight:850;display:flex;align-items:center;gap:8px}
.link{border:0;background:transparent;color:#6683a0;font-size:12px;font-weight:750;padding:6px}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.metric{padding:11px 8px;border-radius:18px;background:linear-gradient(180deg,#f9fcff,#f2f7fc);min-width:0}
.metric-top{display:flex;align-items:center;gap:5px;color:#6e86a0;font-size:10px;font-weight:750}
.metric .num{margin-top:7px;font-size:20px;font-weight:850;letter-spacing:-.7px;white-space:nowrap}
.metric .unit{font-size:9px;color:#8396aa;margin-left:2px}
.metric .badge{display:inline-block;margin-top:7px;border-radius:999px;padding:4px 7px;background:#e2f8ef;color:#239468;font-size:9px;font-weight:800}
.notify{display:grid;gap:8px}
.notice{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:10px;padding:10px 7px;border-radius:17px;background:rgba(246,250,255,.8)}
.nicon{width:42px;height:42px;border-radius:15px;display:grid;place-items:center}
.notice:nth-child(1) .nicon{background:#fff2df;color:#e89028}.notice:nth-child(2) .nicon{background:#e6f1ff;color:#3f86e9}.notice:nth-child(3) .nicon{background:#ffe9ec;color:#ef6070}
.ntxt{min-width:0}.ntxt b{display:block;font-size:13px;margin-bottom:3px}.ntxt span{display:block;font-size:10px;color:#8394a7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ntime{font-size:10px;color:#8999a9;text-align:right}
.banner{margin:16px 18px 0;border-radius:26px;min-height:106px;background:
linear-gradient(90deg,rgba(21,59,94,.77),rgba(37,117,168,.35)),
radial-gradient(circle at 75% 30%,#9fd7dc 0 12%,transparent 13%),
linear-gradient(135deg,#6fabc8,#cfe8ee);box-shadow:var(--shadow2);position:relative;overflow:hidden;padding:20px;color:white;z-index:2}
.banner:before,.banner:after{content:"";position:absolute;bottom:-25px;border-radius:50% 50% 0 0;background:rgba(255,255,255,.20)}
.banner:before{width:230px;height:95px;right:-25px;transform:rotate(-5deg)}.banner:after{width:180px;height:75px;right:95px;bottom:-36px;background:rgba(255,255,255,.12)}
.banner b{display:block;font-size:18px;line-height:1.5;position:relative;z-index:2}.banner span{font-size:11px;opacity:.86;position:relative;z-index:2}
.install{margin:16px 18px 0;padding:13px 14px;border-radius:20px;background:#143b62;color:white;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 10px 26px rgba(19,65,106,.18);position:relative;z-index:2}
.install.hide{display:none}.install div{font-size:12px;font-weight:700;line-height:1.5}.install button{border:0;background:white;color:#173f66;padding:9px 12px;border-radius:12px;font-size:12px;font-weight:850;white-space:nowrap}
.nav{position:fixed;z-index:20;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);padding:9px 13px calc(9px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);background:rgba(250,253,255,.91);border-top:1px solid rgba(42,92,137,.08);backdrop-filter:blur(23px);-webkit-backdrop-filter:blur(23px)}
.nav button{border:0;background:transparent;color:#8b9aab;padding:6px 2px;font-size:10px;font-weight:750;display:grid;place-items:center;gap:3px}
.nav svg{width:22px;height:22px}.nav .active{color:#3c88ef}
.toast{position:fixed;z-index:40;left:50%;bottom:93px;transform:translate(-50%,14px);opacity:0;background:#173957;color:white;border-radius:999px;padding:10px 15px;font-size:12px;font-weight:750;box-shadow:0 9px 28px rgba(14,48,75,.22);transition:.2s;pointer-events:none;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:560px){body{padding:22px 0}.app{border-radius:34px;min-height:calc(100vh - 44px);box-shadow:0 24px 60px rgba(26,67,106,.15)}.nav{bottom:22px;border-radius:0 0 34px 34px}}
</style>
</head>
<body>
<main class="app">
<div class="ambient"></div>
<header class="header">
  <div class="topbar">
    <div class="brand"><h1>安好</h1><p>陪伴，是最安心的力量</p></div>
    <div class="account"><button class="bell" aria-label="通知">♡</button><div class="avatar" aria-label="媽媽">👵🏻</div></div>
  </div>
  <div class="greeting">
    <div><strong>早安，<br>一切都好，就是最大的幸福。</strong><small>媽媽今天也平安在家</small></div>
    <div class="date" id="dateText"></div>
  </div>
</header>

<section class="status">
  <div class="status-main">
    <div class="check"><svg viewBox="0 0 24 24" fill="none"><path d="M6 12.4l3.8 3.7L18.5 8" stroke="#fff" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div class="status-copy"><h2>狀態正常</h2><p>最後上線　今天 09:28</p><div class="pill">● 一切平安・持續守護中</div></div>
    <div class="arrow">›</div>
  </div>
</section>

<section class="actions">
  <button class="action sos" data-action="緊急求助"><div class="action-icon"><svg viewBox="0 0 24 24" fill="none"><path d="M7 5l3 4-2 2c1.5 3 3 4.5 6 6l2-2 4 3-1.5 2c-.7 1-2 1.4-3.1 1C8.8 18.9 5.1 15.2 3 8.6 2.6 7.4 3 6.1 4 5.4L7 5z" stroke="currentColor" stroke-width="1.7"/></svg></div><b>緊急求助</b><span>一鍵聯絡家人</span></button>
  <button class="action video" data-action="視訊"><div class="action-icon"><svg viewBox="0 0 24 24" fill="none"><rect x="3" y="6" width="12" height="12" rx="3" stroke="currentColor" stroke-width="1.8"/><path d="M15 10l5-3v10l-5-3" stroke="currentColor" stroke-width="1.8"/></svg></div><b>視訊</b><span>看看他／她</span></button>
  <button class="action med" data-action="服藥"><div class="action-icon"><svg viewBox="0 0 24 24" fill="none"><path d="M7.3 16.7L16.7 7.3a4 4 0 00-5.7-5.7L1.6 11a4 4 0 005.7 5.7zM7 7l10 10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></div><b>服藥</b><span>今日已完成</span></button>
  <button class="action loc" data-action="定位"><div class="action-icon"><svg viewBox="0 0 24 24" fill="none"><path d="M12 21s7-5.3 7-12A7 7 0 105 9c0 6.7 7 12 7 12z" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="9" r="2.2" stroke="currentColor" stroke-width="1.8"/></svg></div><b>定位</b><span>查看目前位置</span></button>
</section>

<section class="card">
  <div class="card-head"><div class="title">▥ 健康數據</div><button class="link" data-action="健康報告">查看完整報告 ›</button></div>
  <div class="metrics">
    <div class="metric"><div class="metric-top">♥ 心率</div><div class="num">72<span class="unit">次/分</span></div><span class="badge">正常</span></div>
    <div class="metric"><div class="metric-top">◆ 血壓</div><div class="num">118<span class="unit">/76</span></div><span class="badge">正常</span></div>
    <div class="metric"><div class="metric-top">☾ 睡眠</div><div class="num">7<span class="unit">時20分</span></div><span class="badge">良好</span></div>
    <div class="metric"><div class="metric-top">↟ 步數</div><div class="num">2,846</div><span class="badge">57%</span></div>
  </div>
</section>

<section class="card">
  <div class="card-head"><div class="title">♢ 重要通知</div><button class="link" data-action="所有通知">查看全部 ›</button></div>
  <div class="notify">
    <button class="notice" data-action="服藥提醒" style="border:0;width:100%;text-align:left"><div class="nicon">💊</div><div class="ntxt"><b>服藥提醒</b><span>上午 8:00 的血壓藥已完成</span></div><div class="ntime">08:03<br>›</div></button>
    <button class="notice" data-action="安全區域通知" style="border:0;width:100%;text-align:left"><div class="nicon">⌖</div><div class="ntxt"><b>安全區域通知</b><span>目前位置：社區公園附近</span></div><div class="ntime">昨天<br>›</div></button>
    <button class="notice" data-action="家人留言" style="border:0;width:100%;text-align:left"><div class="nicon">♥</div><div class="ntxt"><b>家人留言</b><span>「晚上想吃什麼？我買去給您～」</span></div><div class="ntime">12:14<br>›</div></button>
  </div>
</section>

<section class="banner"><b>更長久的陪伴<br>從每一天的安好開始</b><span>讓距離不再成為擔心的理由</span></section>
<section class="install" id="installCard"><div id="installText">iPhone 可直接加入桌面測試<br>Safari → 分享 → 加入主畫面</div><button id="installBtn">安裝</button></section>

<nav class="nav" aria-label="主要導覽">
<button class="active" data-tab="首頁"><svg viewBox="0 0 24 24" fill="none"><path d="M3 11l9-7 9 7v9H5v-9" stroke="currentColor" stroke-width="2"/><path d="M9 20v-6h6v6" stroke="currentColor" stroke-width="2"/></svg>首頁</button>
<button data-tab="家人"><svg viewBox="0 0 24 24" fill="none"><circle cx="9" cy="8" r="3" stroke="currentColor" stroke-width="2"/><circle cx="17" cy="9" r="2.2" stroke="currentColor" stroke-width="2"/><path d="M3 20c0-4 2.5-6 6-6s6 2 6 6M15 15c3 0 5 1.6 5 5" stroke="currentColor" stroke-width="2"/></svg>家人</button>
<button data-tab="健康"><svg viewBox="0 0 24 24" fill="none"><path d="M20 8c0 5-8 11-8 11S4 13 4 8a4 4 0 017-2.7A4 4 0 0120 8z" stroke="currentColor" stroke-width="2"/></svg>健康</button>
<button data-tab="安全"><svg viewBox="0 0 24 24" fill="none"><path d="M12 3l7 3v5c0 4.5-2.7 7.8-7 10-4.3-2.2-7-5.5-7-10V6l7-3z" stroke="currentColor" stroke-width="2"/><path d="M9 12l2 2 4-5" stroke="currentColor" stroke-width="2"/></svg>安全</button>
<button data-tab="更多"><svg viewBox="0 0 24 24" fill="none"><circle cx="5" cy="12" r="1.5" fill="currentColor"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/><circle cx="19" cy="12" r="1.5" fill="currentColor"/></svg>更多</button>
</nav>
<div class="toast" id="toast"></div>
</main>
<script>
(()=>{
 const d=new Date(),wd=['日','一','二','三','四','五','六'];
 document.getElementById('dateText').innerHTML=(d.getMonth()+1)+'月'+d.getDate()+'日　週'+wd[d.getDay()]+'<br>晴朗・安心守護中';
 const toast=document.getElementById('toast'); let t;
 function show(msg){clearTimeout(t);toast.textContent=msg;toast.classList.add('show');t=setTimeout(()=>toast.classList.remove('show'),1700)}
 document.querySelectorAll('[data-action]').forEach(el=>el.addEventListener('click',()=>show(el.dataset.action+'：測試介面已連線')));
 document.querySelectorAll('[data-tab]').forEach(el=>el.addEventListener('click',()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.remove('active'));el.classList.add('active');show(el.dataset.tab+'頁面將在下一階段接上')}));

 let deferredPrompt=null; const install=document.getElementById('installCard'),btn=document.getElementById('installBtn'),txt=document.getElementById('installText');
 const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
 if(standalone)install.classList.add('hide');
 window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;txt.innerHTML='安好已準備好安裝到桌面<br>點右側按鈕即可';});
 btn.addEventListener('click',async()=>{if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice.catch(()=>{});deferredPrompt=null;return} if(/iphone|ipad|ipod/i.test(navigator.userAgent))alert('請使用 Safari：點下方「分享」圖示 → 選「加入主畫面」→ 右上角「加入」。'); else alert('請從瀏覽器選單選擇「安裝應用程式／加入主畫面」。');});
 if('serviceWorker' in navigator){window.addEventListener('load',async()=>{try{const reg=await navigator.serviceWorker.register('./sw.js?v=1',{scope:'./',updateViaCache:'none'});await reg.update()}catch(e){console.warn(e)}})}
})();
</script>
</body>
</html>
